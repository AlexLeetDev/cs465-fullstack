<!--
  File: edit-trip.component.html

  Overview:
    This template displays the form for editing an existing trip in the
    Travlr Getaways admin application. It connects form fields to the
    EditTripComponent (TypeScript file) using Angular's reactive forms.
  
  Features:
    - Shows all trip details: code, name, length, start date, resort,
      price per person, image,  and description.
    - Trip code is read-only and displayed using Bootstrap's plain text style.
    - Validation is applied to required fields, with feedback shown when 
      fields are empty after submission.
    - The "start" date is formatted as YYYY-MM-DD to work with the date picker.
  
  Form Actions:
    - Submitting the form triggers the onSubmit() method in the TypeScript
      file, which sends updated trip data to the backend API.
-->

<div class="col-md-6 mx-auto p-3">
  <div class="card shadow-sm">
    <div class="card-header">
      <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Trip</h5>
    </div>
    <div class="card-body">
      <!-- Form -->
      <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">

        <!-- Code (read-only, Bootstrap plaintext style) -->
        <div class="form-group">
          <label>Code:</label>
          <input type="text"
                 formControlName="code"
                 class="form-control-plaintext"
                 readonly>
        </div>
        
        <!-- Name -->
        <div class="form-group">
          <label>Name:</label>
          <input type="text" formControlName="name"
                 placeholder="Name"
                 class="form-control"
                 [ngClass]="{ 'is-invalid': submitted && f['name'].errors}">
          <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
            Name is required
          </div>
        </div>
        
        <!-- Length -->
        <div class="form-group">
          <label>Length:</label>
          <input type="text" formControlName="length"
                 placeholder="Length"
                 class="form-control"
                 [ngClass]="{ 'is-invalid': submitted && f['length'].errors}">
          <div *ngIf="submitted && f['length'].errors" class="invalid-feedback">
            Length is required
          </div>
        </div>
        
        <!-- Start -->
        <div class="form-group">
          <label>Start:</label>
          <input type="date" formControlName="start"
                 class="form-control"
                 [ngClass]="{ 'is-invalid': submitted && f['start'].errors}">
          <div *ngIf="submitted && f['start'].errors" class="invalid-feedback">
            Date is required
          </div>
        </div>

        <!-- Resort -->
        <div class="form-group">
          <label>Resort:</label>
          <input type="text" formControlName="resort"
                 placeholder="Resort"
                 class="form-control"
                 [ngClass]="{ 'is-invalid': submitted && f['resort'].errors}">
          <div *ngIf="submitted && f['resort'].errors" class="invalid-feedback">
            Resort is required
          </div>
        </div>
        
        <!-- Per Person -->
        <div class="form-group">
          <label>Per Person:</label>
          <input type="text" formControlName="perPerson"
                 placeholder="Per Person"
                 class="form-control"
                 [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors}">
          <div *ngIf="submitted && f['perPerson'].errors" class="invalid-feedback">
            Per Person is required
          </div>
        </div>
        
        <!-- Image -->
        <div class="form-group">
          <label>Image Name:</label>
          <input type="text" formControlName="image"
                 placeholder="Image"
                 class="form-control"
                 [ngClass]="{ 'is-invalid': submitted && f['image'].errors}">
          <div *ngIf="submitted && f['image'].errors" class="invalid-feedback">
            Image Name is required
          </div>
        </div>
        
        <!-- Description -->
        <div class="form-group">
          <label>Description:</label>
          <input type="text" formControlName="description"
                 placeholder="Description"
                 class="form-control"
                 [ngClass]="{ 'is-invalid': submitted && f['description'].errors}">
          <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
            Description is required
          </div>
        </div>
        
        <!-- Submit button -->
        <div class="d-flex justify-content-end mt-3">
          <button type="submit" class="btn btn-primary">Save</button>
        </div> 
      </form> 
    </div>
  </div>
</div>
